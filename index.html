<style>
  :root{
    --lime:#D5F000;--navy:#0A0D22;--cream:#FFFBF2;
    --ink:#111111;--slate:#6B7280;--line:#E6E6E6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC",sans-serif;line-height:1.7;
    background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);
    background-size:26px 26px;
    -webkit-font-smoothing:antialiased;
  }
  
  .site-bar{
    max-width:920px;margin:0 auto;padding:20px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    font-family:"Noto Sans TC",sans-serif;font-size:15px;
  }
  .site-bar a{color:#0A0D22;text-decoration:none;font-weight:700;}
  .site-bar a:hover{text-decoration:underline;}
  .site-bar .site-brand{display:flex;align-items:center;gap:10px;}
  .site-bar img{width:34px;height:34px;border-radius:50%;display:block;}
  .site-foot{
    border-top:2px solid #E6E6E6;margin-top:40px;
    color:#6B7280;font-size:14px;
  }
  .site-bar a:focus-visible{outline:3px solid #D5F000;outline-offset:3px;}

  .wrap{max-width:920px;margin:0 auto;padding:0 24px 90px;}
  header.top{padding:56px 0 40px;}
  .eyebrow{
    display:inline-block;background:var(--lime);color:var(--navy);
    font-weight:700;font-size:14px;letter-spacing:.06em;
    padding:7px 16px;border-radius:999px;
  }
  h1{font-weight:900;font-size:clamp(44px,9vw,78px);line-height:1;
     letter-spacing:-.03em;margin:22px 0 0;}
  .bar{width:120px;height:9px;background:var(--lime);margin:22px 0 0;}
  ul.posts{list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:16px;}
  .post a{
    display:block;text-decoration:none;color:inherit;
    background:#fff;border:3px solid var(--navy);border-radius:24px;
    padding:26px 28px;transition:transform .12s ease;
  }
  .post a:hover{transform:translateY(-3px);}
  .post a:focus-visible{outline:3px solid var(--lime);outline-offset:3px;}
  .post time{
    font-family:"JetBrains Mono",monospace;font-size:12.5px;
    color:var(--slate);letter-spacing:.08em;
  }
  .post h2{font-size:26px;font-weight:900;letter-spacing:-.02em;
    margin:8px 0 8px;line-height:1.2;}
  .post p{margin:0;color:var(--slate);font-size:16px;}
  .empty{color:var(--slate);}
  @media(prefers-reduced-motion:reduce){.post a{transition:none;}}
</style>
